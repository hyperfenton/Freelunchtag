name: Render homepage quality variants

on:
  push:
    branches: [quality-homepage-20261124]

permissions:
  contents: write

concurrency:
  group: homepage-quality-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QUALITY_SOURCE_DIR: /tmp/homepage-quality-sources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil python3-numpy python3-scipy
      - name: Prepare verified photographs and accepted camera transitions
        run: |
          python3 scripts/prepare-quality-sources.py "$QUALITY_SOURCE_DIR" --threads 2
      - name: Render repaired desktop videos and stills
        run: |
          python3 scripts/render-quality-editions.py wide \
            --source-dir "$QUALITY_SOURCE_DIR" --motion camera \
            --motion-override-dir "$QUALITY_SOURCE_DIR/motion" \
            --cuts-config film-source/pass-the-salsa/motion-edits.json \
            --threads 2 --preset medium
      - name: Verify delivery and guest flow
        run: |
          node --test scripts/page-flow.test.mjs scripts/film-quality.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for path in sorted(Path('assets/pass-the-salsa').glob('*.mp4')):
              subprocess.run(['ffmpeg', '-v', 'error', '-xerror', '-threads', '2', '-i', str(path), '-f', 'null', '-'], check=True)
              print('Decoded ' + path.name, flush=True)
          PY
          git diff --check
      - name: Save verified media to the staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pass-the-salsa
          git commit -m 'Render repaired original lime transition at 4K, HD and 720p'
          git push origin HEAD:quality-homepage-20261124
